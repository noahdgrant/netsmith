# cargo nextest's settings, for the CI jobs that run it (.github/workflows/ci.yml).
# A test that runs longer than a minute is named as SLOW in the log, once a minute. Nothing ends
# it: a test should take under about two minutes on CI (AGENTS.md, Tests).
[profile.default]
slow-timeout = { period = "60s" }

# The mixed board's seeds take 110 to 160 s on a runner to themselves, and no test fails by its
# time (the limit they pass to the router is a hang guard of ten minutes, `guard.rs` of the
# router's tests, #663). Each takes the whole runner, so that the time it takes is the router's.
[[profile.default.overrides]]
filter = 'test(/^mixed::the_mixed_board_is_routed_completely_seed_/)'
threads-required = "num-cpus"
