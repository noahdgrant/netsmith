# Checks every pull request and every push to main: formatting, clippy with warnings as errors,
# and the tests. The same three commands as AGENTS.md ("Build, test, lint").
#
# A pull request runs only the jobs its change needs, and `test` and `kicad` run only the tests of
# the crates it changes and of their dependents (`crates`, below). The `changes` job lists the paths the pull
# request changes and scripts/ci-changes turns them into five flags, `rust`, `kicad`, `recipes`,
# `no_kicad` and `locks` (the rules, and why, are in that script). `fmt` always runs. `clippy` and `test`
# need `rust`, `kicad` needs `kicad`, `recipes` needs `recipes`, `no-kicad` needs `no_kicad`, `locks` needs `locks`: a
# change to prose only runs `fmt`. A
# push to main, a change to the workflows or to scripts/, and a path the script does not know run
# everything. A change to a test file of a crate turns `kicad` on only if the file can ask for
# KiCad (it names kicad-cli, the stock libraries, a Workspace, the binary...), and never turns
# `recipes` on; a change to the source of a crate is not narrowed (the script's header says why).
# The `changes` job runs scripts/ci-changes-test first, a table of paths and the flags they must
# give, so an edit of the rules cannot widen or narrow them unnoticed. `ci-ok` waits for all the
# others and fails if one failed or was cancelled; a job that was left out counts as passed. It is
# the one check a branch protection rule needs to name.
#
# `test` has no KiCad on its runner, so it stays fast. The tests that need `kicad-cli` or KiCad's
# stock libraries skip themselves there (they print "skipped: ..."); the rest build with the
# small libraries of `netsmith_kicad::testlib`. The `kicad` job installs KiCad 9 and runs the
# tests that can ask for KiCad (scripts/ci-kicad-tests), so those tests really run; it starts once
# `test` has passed. No Node either: the editor's page is the committed
# bundle. `test` is four slices of cargo nextest that run side by side (one run of
# `cargo test` took fourteen minutes, three of them compiling, and runs one test binary after
# the other), and `kicad` is three slices of the same kind (a slice installs KiCad 9, about
# twenty seconds); scripts/ci-test-slices proves that the slices of each run every test once.
# The workspace is compiled once, by the `build` job (issue #510): the slices run its archive of
# the tests, and `no-kicad`, `locks` and `recipes` its `netsmith` binary, so a pull request
# compiles once and not once a job, and its jobs take fewer of the account's runners.
#
# KiCad 9 and Chromium's system libraries come from a cache of the .deb files, not from Ubuntu's
# mirrors (.github/actions/apt-cache, scripts/ci-apt-cache): when the mirrors are down (they were
# for hours on 2026-11-11, and every apt-get of every job failed) a job with a warm cache still
# passes. .github/workflows/apt-cache.yml fills the caches every day.
#
# The `recipes` job drives the editor in headless Chromium (Playwright, Node 22): it builds the
# `netsmith` binary and runs `scripts/editor-verify-all`, every recipe of
# scripts/editor-verify-js/recipes against the fixture it declares. It installs KiCad 9 the way
# the `kicad` job does: the build and order recipes write KiCad files, and the PCB recipes of the
# `outline_and_pours` fixture draw its stock footprints. It is two slices, each driving
# half of the recipes by the seconds they took (scripts/editor-verify-weights);
# scripts/ci-recipe-slices deals them out and proves that every recipe runs in exactly one slice
# (see there to rebalance). It is not a required check yet; the screenshots and the server log of
# a failing sweep are the `recipes-evidence-<slice>` artifact of the run.
#
# A slice is a job of its own (`test (1)`, `kicad (2)`, `recipes (3)`), and a job that is a
# matrix fails if one of its slices does, so `ci-ok` still names `test`, `kicad` and `recipes`.
#
# The `no-kicad` job is the reverse of `kicad`: a plain runner that installs no KiCad, builds the
# `netsmith` binary and runs scripts/check-no-kicad.sh, which builds and fabs every example with
# KiCad hidden and fails if a run needs it (ADR 0097, step 4). Together they say that netsmith
# needs no KiCad and that what it draws agrees with KiCad's where KiCad is there.
#
# The `locks` job runs scripts/check-example-locks.sh: `netsmith lock --check` over every example,
# which fails when an example's committed pick lock (`<stem>.lock.toml`, ADR 0100) is stale or
# missing, that is, when a change to a catalog, `std/` or the solver would move a pick. The fix is
# `netsmith lock --update` in the example and a review of the diff of the lock.
#
# The Rust cache (Swatinem/rust-cache, in `build` and `clippy`) is saved by pushes to main only, and a pull request
# restores the newest of main's: the pull requests do not fill the repository's cache quota with
# a copy each.
# The release pull request that release-please opens (`release-please--branches--main`: a version
# bump, the changelog) runs nothing here: `changes`, `fmt` and `ci-ok` are skipped by that branch
# name, and every other job needs `changes`, so it is skipped too. Only the title check
# (pr-title.yml) runs on it. The release commit's content is a version number and prose; what
# it releases was tested when each change merged, and a push to main runs everything.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which of the jobs below the change needs: the paths of the pull request (the merge commit
  # against its first parent, renames as a deletion and an addition) through scripts/ci-changes.
  changes:
    if: github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.flags.outputs.rust }}
      kicad: ${{ steps.flags.outputs.kicad }}
      recipes: ${{ steps.flags.outputs.recipes }}
      no_kicad: ${{ steps.flags.outputs.no_kicad }}
      locks: ${{ steps.flags.outputs.locks }}
      crates: ${{ steps.flags.outputs.crates }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # The table of scripts/ci-changes: a second, with nothing but bash.
      - name: Test the rules of ci-changes
        run: scripts/ci-changes-test

      # The ADRs against docs/adr/README.md: size and status words (bash only, so it runs on every pull request).
      - name: Check the ADRs
        run: scripts/adr-check

      - id: flags
        # `shell: bash` runs with `-eo pipefail`: a crash of ci-changes fails the step instead of
        # being hidden by `tee` (no outputs would skip every job, and ci-ok accepts a skip).
        shell: bash
        run: |
          everything() { printf 'rust=true\nkicad=true\nrecipes=true\nno_kicad=true\nlocks=true\ncrates=\n'; }
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "not a pull request: everything runs"
            everything >> "$GITHUB_OUTPUT"
          elif ! git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            echo "no merge commit to compare: everything runs"
            everything >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --no-renames HEAD^1 HEAD | tee changed.txt
            scripts/ci-changes < changed.txt | tee -a "$GITHUB_OUTPUT"
          fi

  fmt:
    if: github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        # The version and components of rust-toolchain.toml.
        run: rustup toolchain install

      - run: cargo fmt --all --check

  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        # The version and components of rust-toolchain.toml.
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The one compile of the tests (issue #510): `cargo nextest archive` builds every test binary
  # of the workspace into tests.tar.zst, and the `netsmith` binary (with KiCad's lookup example,
  # for the `kicad` job's log) goes into bin.tar. The `test` and `kicad` slices run the archive and
  # `no-kicad`, `locks` and `recipes` run the binary; none of them compiles. The proofs that need
  # the build run here: the doc tests (nextest runs none; the workspace has none today), that the
  # slices of `test` and of `kicad` each run their tests exactly once (scripts/ci-test-slices, with
  # the slice counts of those two jobs' matrices: change both together), and the list of the tests
  # the `kicad` job selects, for the `test` slices' check. The Rust cache is this job's only.
  build:
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' || needs.changes.outputs.kicad == 'true' ||
      needs.changes.outputs.no_kicad == 'true' || needs.changes.outputs.locks == 'true' ||
      needs.changes.outputs.recipes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        # The version and components of rust-toolchain.toml.
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: nextest@0.9.151

      - name: Build the tests into an archive
        run: cargo nextest archive --workspace --archive-file tests.tar.zst

      # target/debug/netsmith is the binary the archive's integration tests were built with.
      - name: The netsmith binary and KiCad's lookup example
        run: |
          cargo build -p netsmith-kicad --example locate
          tar -cf bin.tar target/debug/netsmith target/debug/examples/locate
          ls -l tests.tar.zst bin.tar

      - name: Doc tests
        run: cargo test --workspace --doc --no-fail-fast

      - name: Every test runs in exactly one slice of `test`
        run: scripts/ci-test-slices 4

      - name: Every selected test runs in exactly one slice of `kicad`
        run: scripts/ci-test-slices 3 kicad

      - name: The tests the kicad job runs
        run: scripts/ci-kicad-tests --list > kicad-tests.txt

      # Already compressed (zstd): no second compression.
      - uses: actions/upload-artifact@v4
        with:
          name: tests
          path: |
            tests.tar.zst
            kicad-tests.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: bin
          path: bin.tar
          retention-days: 1
          if-no-files-found: error

  # --no-fail-fast: one run lists every failing test, not just the first test that fails.
  # nextest deals the tests of the whole workspace out to the slices one by one (so the slow
  # tests of one binary go to different slices) and runs the tests of a slice in parallel,
  # across binaries. It runs the archive of the `build` job, so it compiles nothing.
  test:
    needs: [changes, build]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-nextest
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: nextest@0.9.151

      # What the `build` job built: the archive of the tests, and the netsmith binary at
      # target/debug/netsmith, where the tests' `env!("CARGO_BIN_EXE_netsmith")` points (every
      # runner checks out to the same folder). Nothing is compiled here.
      - uses: actions/download-artifact@v4
        with:
          name: tests
      - uses: actions/download-artifact@v4
        with:
          name: bin
      - run: tar -xf bin.tar

      # NETSMITH_KICAD_PROBE_LOG: each test that looks for KiCad (Search::machine) writes its name
      # there, and the step after this one checks that the `kicad` job runs it.
      # CRATES (from `changes`, issue #511): when the change is inside some crates only, the run is
      # their tests and their dependents' (`rdeps`); empty runs every test. A slice of a narrowed
      # run may hold no test, which passes.
      - name: Test, slice ${{ matrix.slice }} of ${{ strategy.job-total }}
        env:
          NETSMITH_KICAD_PROBE_LOG: ${{ runner.temp }}/kicad-probe.log
          CRATES: ${{ needs.changes.outputs.crates }}
        run: |
          filter=()
          if [ -n "$CRATES" ]; then
            expr="$(printf 'rdeps(%s) | ' $CRATES)"; expr="${expr% | }"
            echo "only the tests of: $expr"
            filter=(-E "$expr" --no-tests=pass)
          fi
          cargo-nextest nextest run --archive-file tests.tar.zst --workspace-remap "$GITHUB_WORKSPACE" --no-fail-fast "${filter[@]}" \
            --partition slice:${{ matrix.slice }}/${{ strategy.job-total }}

      # Every test of this slice that looked for KiCad is one the `kicad` job selects
      # (scripts/ci-kicad-tests): a test that needs KiCad cannot be left out of it unseen.
      - name: The kicad job runs every test that looks for KiCad
        if: always()
        env:
          KICAD_TESTS: kicad-tests.txt
        run: scripts/ci-kicad-tests --check "$RUNNER_TEMP/kicad-probe.log"


  # The tests that can ask for KiCad, with KiCad 9 installed, so the ones that skip themselves in `test` run.
  # The runner's own Ubuntu archive carries KiCad 9 (ubuntu-latest is 26.04: 9.0.8). The version
  # is pinned to the major by the check below: the cross-check's allowance applies only to
  # exactly 9.0.0 (ADR 0034), so a 9.0.x newer than that is what is wanted. If ubuntu-latest
  # moves to a release that ships another major, the step fails; add the KiCad team's PPA
  # (ppa:kicad/kicad-9.0-releases) for that release then.
  # Only the tests that can ask for KiCad run here (scripts/ci-kicad-tests says which, and the
  # `test` job proves that no test looked for KiCad outside them); the rest gain nothing from a
  # second run. Sliced like `test` (cargo nextest, the same partition over that filter, so
  # scripts/ci-test-slices proves it). It starts after `test`, so a pull request whose tests fail
  # takes no KiCad runner; a push to main waits for `test` too, since `needs` cannot differ by event.
  kicad:
    needs: [changes, build, test]
    if: needs.changes.outputs.kicad == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-nextest
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: nextest@0.9.151

      # What the `build` job built: the archive of the tests, and the netsmith binary at
      # target/debug/netsmith, where the tests' `env!("CARGO_BIN_EXE_netsmith")` points (every
      # runner checks out to the same folder). Nothing is compiled here.
      - uses: actions/download-artifact@v4
        with:
          name: tests
      - uses: actions/download-artifact@v4
        with:
          name: bin
      - run: tar -xf bin.tar

      # kicad-cli, and the stock symbol and footprint libraries (separate packages, only
      # recommended by `kicad`). The 3D models (kicad-packages3d, several GB) are not installed,
      # nothing here reads them.
      # From the cache of .deb files (.github/actions/apt-cache), from the archive when it has
      # none that installs: the job does not need Ubuntu's mirrors.
      - name: Install KiCad 9 from the package cache
        uses: ./.github/actions/apt-cache
        with:
          install: kicad

      - name: Check KiCad 9
        run: |
          kicad-cli --version
          dpkg -l kicad kicad-symbols kicad-footprints | tail -3
          case "$(kicad-cli --version)" in
            9.*) ;;
            *) echo "::error::KiCad 9 is wanted, the runner installed $(kicad-cli --version)"; exit 1 ;;
          esac

      # What the lookup of netsmith_kicad::install finds on a real Linux install (issue #6): the
      # packages' own folders, with nothing set.
      - name: Show the KiCad library lookup
        run: target/debug/examples/locate

      # The tests were written against the libraries of KiCad 9.0.0 (the stock footprints they
      # compare with, the fiducial's clearance, the VQFP footprints), and the 9.0.x libraries
      # since have moved (9.0.7: 360 of 788 generated footprints differ from KiCad's, issue
      # #103). So netsmith reads the upstream libraries at the tag 9.0.0, through the variables
      # of the lookup, while kicad-cli is the 9.0.x of the package.
      - name: Cache the KiCad 9.0.0 libraries
        id: libs
        uses: actions/cache@v4
        with:
          path: ~/kicad-libs
          key: kicad-libs-9.0.0-v1

      - name: Fetch the KiCad 9.0.0 libraries
        if: steps.libs.outputs.cache-hit != 'true'
        run: |
          fetch() {
            name="$1"; sha="$2"
            mkdir -p ~/kicad-libs/"$name"
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              -o "$RUNNER_TEMP/$name.tar.gz" \
              "https://gitlab.com/kicad/libraries/kicad-$name/-/archive/9.0.0/kicad-$name-9.0.0.tar.gz"
            echo "$sha  $RUNNER_TEMP/$name.tar.gz" | sha256sum --check
            tar -xzf "$RUNNER_TEMP/$name.tar.gz" --strip-components=1 -C ~/kicad-libs/"$name"
          }
          fetch symbols e90f557a172ca99ab4ec546802511fac4139738f505996f94180541828fa3f4a
          fetch footprints f9444c53a06ba64fde0c87b20c42de0b9d2efdffe15822b43474fcf03aa7229a

      - name: Point netsmith at the KiCad 9.0.0 libraries
        run: |
          echo "NETSMITH_KICAD_SYMBOLS=$HOME/kicad-libs/symbols" >> "$GITHUB_ENV"
          echo "NETSMITH_KICAD_FOOTPRINTS=$HOME/kicad-libs/footprints" >> "$GITHUB_ENV"

      - name: Show the KiCad library lookup with the variables
        run: target/debug/examples/locate

      # --success-output immediate shows the output of the tests that pass, so the "skipped: ..."
      # lines are in the log and the run can prove that no test skipped itself for want of KiCad
      # (`--no-capture` would do that too, but nextest then runs one test at a time). The output
      # goes to a file and not through a pipe: a process a test leaves running (one run had a
      # hung child) would hold the pipe open and the step would never end, although every test
      # had finished.
      - name: Test with KiCad, slice ${{ matrix.slice }} of ${{ strategy.job-total }}
        timeout-minutes: 30
        # The filter goes into a variable first: if it failed inside the argument list, the run
        # would get none and run every test.
        # CRATES narrows it as in `test`.
        env:
          CRATES: ${{ needs.changes.outputs.crates }}
        run: |
          filter="$(scripts/ci-kicad-tests)"
          extra=()
          if [ -n "$CRATES" ]; then
            crates="$(printf 'rdeps(%s) | ' $CRATES)"; crates="${crates% | }"
            echo "only the tests of: $crates"
            filter="($filter) & ($crates)"
            extra=(--no-tests=pass)
          fi
          status=0
          cargo-nextest nextest run --archive-file tests.tar.zst --workspace-remap "$GITHUB_WORKSPACE" --no-fail-fast -E "$filter" "${extra[@]}" \
            --success-output immediate --failure-output immediate \
            --partition slice:${{ matrix.slice }}/${{ strategy.job-total }} > test.log 2>&1 || status=$?
          cat test.log
          if grep -n "skipped: no KiCad symbol and footprint libraries" test.log; then
            echo "::error::a test skipped itself although KiCad is installed"
            status=1
          fi
          exit $status


  # netsmith with no KiCad (ADR 0097, step 4): the runner installs none, and scripts/check-no-kicad.sh
  # hides what could still be found (the libraries, kicad-cli, the Windows KiCad of WSL) and builds
  # and fabs every example. It runs the debug binary the `recipes` job builds, so it shares the cache.
  no-kicad:
    needs: [changes, build]
    if: needs.changes.outputs.no_kicad == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The netsmith binary the `build` job built, at target/debug/netsmith.
      - uses: actions/download-artifact@v4
        with:
          name: bin
      - run: tar -xf bin.tar

      # The runner is a plain ubuntu-latest, and this job installs no KiCad. What it has is shown;
      # the script hides it all the same, and fails if `fab` still finds a kicad-cli.
      - name: Show that no KiCad is installed
        run: |
          command -v kicad-cli || echo "no kicad-cli on PATH"
          ls -d /usr/share/kicad 2> /dev/null || echo "no /usr/share/kicad"

      - name: Build and fab every example with KiCad hidden
        run: scripts/check-no-kicad.sh target/debug/netsmith

  # The examples' pick locks (ADR 0100): scripts/check-example-locks.sh runs `netsmith lock --check`
  # over every example with no KiCad, and fails when a lock is stale or missing. It builds the same
  # debug binary as `no-kicad`, so it shares the cache.
  locks:
    needs: [changes, build]
    if: needs.changes.outputs.locks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The script's own checks, over a fake examples folder with a stub binary (bash only, quick).
      - name: Test the script
        run: scripts/check-example-locks-test

      # The netsmith binary the `build` job built, at target/debug/netsmith.
      - uses: actions/download-artifact@v4
        with:
          name: bin
      - run: tar -xf bin.tar

      - name: Every example's pick lock is current
        run: scripts/check-example-locks.sh target/debug/netsmith

  # The editor's browser recipes (.agents/skills/netsmith-dev-verify-editor/SKILL.md). The page is
  # the committed bundle, so the binary is a plain debug build and Node is only for the driver.
  # A slice runs its share of the recipes, session by session, and lists each one that failed;
  # scripts/ci-recipe-slices says which recipes are the slice's, by their seconds.
  recipes:
    needs: [changes, build]
    if: needs.changes.outputs.recipes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2]
    steps:
      - uses: actions/checkout@v4

      # The netsmith binary the `build` job built, at target/debug/netsmith.
      - uses: actions/download-artifact@v4
        with:
          name: bin
      - run: tar -xf bin.tar

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund
        working-directory: scripts/editor-verify-js

      # The slices between them are the whole sweep, each recipe in one slice. It reads the
      # recipes' own list, with no browser and no build, so every slice checks it (a second).
      - name: Every recipe runs in exactly one slice
        run: scripts/ci-recipe-slices ${{ strategy.job-total }}

      # The browser is cached, and so are the .deb files of its system libraries and fonts
      # (.github/actions/apt-cache, the same cache as the KiCad install below).
      - name: Cache Playwright's Chromium
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/editor-verify-js/package-lock.json') }}

      - name: Install Chromium's system libraries from the package cache
        uses: ./.github/actions/apt-cache
        with:
          install: chromium

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: scripts/editor-verify-js
        run: npx playwright install chromium

      # After Chromium's libraries, so its list of packages is shorter than the `kicad` job's:
      # a cache of its own.
      - name: Install KiCad 9 from the package cache
        uses: ./.github/actions/apt-cache
        with:
          install: kicad
          name: recipes-kicad

      - name: Check KiCad 9
        run: kicad-cli --version

      # The same KiCad 9.0.0 libraries as the `kicad` job (same cache key), so the footprints are
      # the ones the editor's checks were written against.
      - name: Cache the KiCad 9.0.0 libraries
        id: libs
        uses: actions/cache@v4
        with:
          path: ~/kicad-libs
          key: kicad-libs-9.0.0-v1

      - name: Fetch the KiCad 9.0.0 libraries
        if: steps.libs.outputs.cache-hit != 'true'
        run: |
          fetch() {
            name="$1"; sha="$2"
            mkdir -p ~/kicad-libs/"$name"
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              -o "$RUNNER_TEMP/$name.tar.gz" \
              "https://gitlab.com/kicad/libraries/kicad-$name/-/archive/9.0.0/kicad-$name-9.0.0.tar.gz"
            echo "$sha  $RUNNER_TEMP/$name.tar.gz" | sha256sum --check
            tar -xzf "$RUNNER_TEMP/$name.tar.gz" --strip-components=1 -C ~/kicad-libs/"$name"
          }
          fetch symbols e90f557a172ca99ab4ec546802511fac4139738f505996f94180541828fa3f4a
          fetch footprints f9444c53a06ba64fde0c87b20c42de0b9d2efdffe15822b43474fcf03aa7229a

      - name: Point netsmith at the KiCad 9.0.0 libraries
        run: |
          echo "NETSMITH_KICAD_SYMBOLS=$HOME/kicad-libs/symbols" >> "$GITHUB_ENV"
          echo "NETSMITH_KICAD_FOOTPRINTS=$HOME/kicad-libs/footprints" >> "$GITHUB_ENV"

      - run: scripts/editor-verify doctor

      # The list goes into a variable first: if the slicing failed inside the argument list, the
      # sweep would get no names and run every recipe.
      - name: Drive the recipes, slice ${{ matrix.slice }} of ${{ strategy.job-total }}
        run: |
          recipes="$(scripts/ci-recipe-slices ${{ strategy.job-total }} ${{ matrix.slice }})"
          echo "$recipes"
          # shellcheck disable=SC2086 # the recipe names are words
          scripts/editor-verify-all $recipes

      - name: Keep the evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recipes-evidence-${{ matrix.slice }}
          # The sweep's default: $NETSMITH_VERIFY_DIR-all.
          path: /tmp/netsmith-verify-all
          retention-days: 7

  # The one check that says whether the run is good: it fails if a job failed or was cancelled,
  # and passes if each one passed or was left out for want of a reason to run (`changes` says
  # so). The result of `test`, `kicad` and `recipes` is the worst of their slices: it needs
  # all of them. A required check named for one of the other jobs would block a pull request
  # that does not run it.
  ci-ok:
    if: always() && github.head_ref != 'release-please--branches--main'
    needs: [changes, fmt, clippy, build, test, kicad, no-kicad, locks, recipes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result != "success" and .result != "skipped")' > /dev/null; then
            echo "::error::a job failed or was cancelled"
            exit 1
          fi
