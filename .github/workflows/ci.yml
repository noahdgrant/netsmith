# Checks every pull request and every push to main: formatting, clippy with warnings as errors,
# and the tests. The same three commands as AGENTS.md ("Build, test, lint").
#
# No KiCad is installed on the runner. The tests that need `kicad-cli` or KiCad's stock libraries
# skip themselves without it (they print "skipped: ..."); the rest build with the small libraries
# of `netsmith_kicad::testlib`. No Node either: the editor's page is the committed bundle.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # --no-fail-fast: one run lists every failing test, not just the first test binary that fails.
      - run: cargo test --workspace --no-fail-fast
