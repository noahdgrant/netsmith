# UNVERIFIED DRAFT. This file was written without being able to run GitHub Actions: no workflow
# run, no runner image, no package-manager install below has been tried. scripts/release-build.sh
# was run on Linux (WSL, x86_64-unknown-linux-gnu) only; the macOS and Windows legs, the KiCad
# installs and the upload step are untested. Expect to fix them on the first run on a tag.
#
# On a tag `v*` (release-please makes the tag and the release: release-please.yml) it builds
# netsmith on Linux, macOS and Windows runners with scripts/release-build.sh (release build,
# `netsmith --version`, a smoke test of init/build/fab and the editor page, then a tar.gz or zip
# with LICENSE, README.md and checksums) and attaches the archives and their .sha256 files to the
# GitHub release of the tag (a draft one if there is none). No Node is installed: the editor's
# page is the committed bundle.
# `build` and `fab` need KiCad's libraries, so each runner installs KiCad for the smoke test; the
# archives do not contain KiCad (a user needs KiCad's libraries too, see the README).
name: release

on:
  push:
    tags: ["v*"]
  # A run by hand builds, smoke-tests and packs on the three systems of the branch it is run on,
  # attaches nothing to any release and checks nothing against a tag: a way to try this file
  # without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kicad: linux
          - os: macos-latest
            kicad: macos
          - os: windows-latest
            kicad: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The paths are where each package puts KiCad 9's libraries. Unverified: check them on the
      # first run (the smoke test stops with the missing path if one is wrong).
      - name: KiCad libraries (Linux)
        if: matrix.kicad == 'linux'
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad-symbols kicad-footprints
          echo "NETSMITH_KICAD_SYMBOLS=/usr/share/kicad/symbols" >> "$GITHUB_ENV"
          echo "NETSMITH_KICAD_FOOTPRINTS=/usr/share/kicad/footprints" >> "$GITHUB_ENV"

      - name: KiCad libraries (macOS)
        if: matrix.kicad == 'macos'
        run: |
          brew install --cask kicad
          echo "NETSMITH_KICAD_SYMBOLS=/Applications/KiCad/KiCad.app/Contents/SharedSupport/symbols" >> "$GITHUB_ENV"
          echo "NETSMITH_KICAD_FOOTPRINTS=/Applications/KiCad/KiCad.app/Contents/SharedSupport/footprints" >> "$GITHUB_ENV"

      - name: KiCad libraries (Windows)
        if: matrix.kicad == 'windows'
        run: |
          choco install kicad --yes --no-progress
          # The package installs the latest KiCad (10.0.8 on 2026-11-09), in a folder named by its
          # version: take whichever one is there instead of naming 9.0.
          symbols="$(ls -d "/c/Program Files/KiCad/"*/share/kicad/symbols | sort -V | tail -n 1)"
          [ -d "$symbols" ] || { echo "no KiCad symbols folder under C:/Program Files/KiCad" >&2; exit 1; }
          footprints="$(dirname "$symbols")/footprints"
          [ -d "$footprints" ] || { echo "no KiCad footprints folder beside $symbols" >&2; exit 1; }
          echo "NETSMITH_KICAD_SYMBOLS=$(cygpath -m "$symbols")" >> "$GITHUB_ENV"
          echo "NETSMITH_KICAD_FOOTPRINTS=$(cygpath -m "$footprints")" >> "$GITHUB_ENV"

      - name: Build, smoke test and pack
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/release-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: netsmith-${{ matrix.os }}
          path: dist-release/*

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Draft release with the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist-release
          # release-please makes the release for the tag; add the archives to it. A tag pushed by
          # hand has no release yet: make a draft.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist-release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist-release/* --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
