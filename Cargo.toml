[workspace]
resolver = "2"
members = ["crates/netsmith-core", "crates/netsmith-kicad", "crates/netsmith-lang", "crates/netsmith-quantity", "crates/netsmith-check", "crates/netsmith-solve", "crates/netsmith-catalog", "crates/netsmith-design", "crates/netsmith", "crates/netsmith-cli", "crates/netsmith-view", "crates/netsmith-pcb", "crates/netsmith-3d", "crates/netsmith-placer", "crates/netsmith-router", "crates/netsmith-fab", "crates/netsmith-pipeline", "crates/netsmith-fabricate", "crates/netsmith-workspace", "crates/netsmith-netlist", "crates/netsmith-editor", "crates/netsmith-dxf", "crates/netsmith-testkit", "crates/netsmith-sexp", "crates/netsmith-geom"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# A test build is one executable for every file in a crate's `tests/` folder, and each links the
# whole dependency tree with its own debug information. Line tables alone (no variable or type
# information) keep what a failing test needs, a backtrace with file and line, and make the
# executables and the link a good deal smaller (#190). A debugger no longer shows local
# variables: set `CARGO_PROFILE_DEV_DEBUG=2` for a build you want to step through. The release
# profile is not touched.
[profile.dev]
debug = "line-tables-only"

# The placer and the router are loops over thousands of small steps: a debug build of the
# rest of the workspace is quick to build and to step through, and these crates (the board model
# in netsmith-pcb, the placer in netsmith-placer, the router in netsmith-router) are optimised so
# that their tests (a board of seventy parts is placed and routed) take seconds, not minutes.
[profile.dev.package.netsmith-pcb]
opt-level = 2

[profile.dev.package.netsmith-placer]
opt-level = 2

[profile.dev.package.netsmith-router]
opt-level = 2

# The 3D scene, its meshes and the rasterizer were optimised with netsmith-pcb before they were
# a crate of their own (issue #518), and stay so: their tests take about 2.8 s optimised and
# 10.6 s not, and `netsmith board3d` and `netsmith render` in a debug build keep their speed.
[profile.dev.package.netsmith-3d]
opt-level = 2

# The solver searches thousands of candidate combinations on a real board: a real 12 V automotive board (about 60 parts, two buck stages) takes
# about 7.4 s to build in a debug build and 1.25 s with these crates optimised (10.2 s to 1.9 s in
# the editor, which also draws the schematic with netsmith-view). They are quick to build, so the
# cost is a first compile of about 30 s and less debuggable solver code.
[profile.dev.package.netsmith-solve]
opt-level = 2

[profile.dev.package.netsmith-quantity]
opt-level = 2

[profile.dev.package.netsmith-core]
opt-level = 2

[profile.dev.package.netsmith-check]
opt-level = 2

[profile.dev.package.netsmith-view]
opt-level = 2
