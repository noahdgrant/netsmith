[package]
name = "netsmith-dc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A feasibility prototype of a post-pick DC operating-point analysis (ADR 0076, proposed)"

# The tests are one executable, tests/main.rs, with the other files of the folder as its modules
# (#190): without this, cargo builds and links every file of the folder as well.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

# No dependencies on purpose: the prototype is a small solver over its own netlist and nothing
# in the workspace uses it, so it changes no behaviour of `build`.
[dependencies]
