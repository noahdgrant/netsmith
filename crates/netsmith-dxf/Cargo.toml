[package]
name = "netsmith-dxf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A reader for the outline, cutouts and holes of a board in an ASCII DXF file (ADR 0045)."
# The tests are one executable, tests/main.rs, with the other files of the folder as its modules
# (#190): without this, cargo builds and links every file of the folder as well.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dev-dependencies]
automod = "1.0.17"
