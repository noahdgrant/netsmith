[package]
name = "netsmith-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
# The tests are one executable, tests/main.rs, with the other files of the folder as its modules
# (#190): without this, cargo builds and links every file of the folder as well.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
netsmith-core = { path = "../netsmith-core" }
axum = { version = "0.8.9", features = ["ws"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
ts-rs = "12.0.1"

[dev-dependencies]
netsmith-kicad = { path = "../netsmith-kicad" }
tungstenite = "0.30.0"
