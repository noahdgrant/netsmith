    <script id="theme-boot">
      // The theme, chosen before the first paint so the page does not flash the wrong colours.
      // The same decision as resolveTheme in src/theme.ts (src/theme.test.ts runs both).
      (function () {
        var pref = 'system';
        try {
          var v = JSON.parse(window.localStorage.getItem('netsmith.theme'));
          if (['light', 'dark', 'hc-dark', 'hc-light'].indexOf(v) >= 0) pref = v;
        } catch (e) {}
        var theme = pref;
        if (pref === 'system') {
          var dark = true, more = false;
          try {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            more = window.matchMedia('(prefers-contrast: more)').matches;
          } catch (e) {}
          theme = more ? (dark ? 'hc-dark' : 'hc-light') : dark ? 'dark' : 'light';
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme === 'dark' || theme === 'hc-dark' ? 'dark' : 'light';
      })();
    </script>
    <script id="settings-boot">
      // The density, the size and the motion, applied before the first paint (the same decision as rootState in src/settings.ts;
      // src/settings.test.ts runs both).
      (function () {
        var d = 'comfortable', k = 100, m = 'system';
        try {
          var v = JSON.parse(window.localStorage.getItem('netsmith.settings'));
          if (v && typeof v === 'object') {
            if (v.density === 'compact') d = 'compact';
            if ([90, 100, 110, 125].indexOf(v.scale) >= 0) k = v.scale;
            if (v.motion === 'reduce') m = 'reduce';
          }
        } catch (e) {}
        var root = document.documentElement;
        root.dataset.density = d;
        root.dataset.motion = m;
        root.style.setProperty('--ui-scale', String(k / 100));
      })();
    </script>
