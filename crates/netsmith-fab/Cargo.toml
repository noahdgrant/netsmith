[package]
name = "netsmith-fab"
version.workspace = true
edition.workspace = true
license.workspace = true
# The tests are one executable, tests/main.rs, with the other files of the folder as its modules
# (#190): without this, cargo builds and links every file of the folder as well.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
zip = { version = "6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde_json = "1.0.154"
# Polygon unions and differences, for the copper as polygons (`polygons`, ADR 0105).
i_overlay = "9.1.0"
# Where `kicad-cli` is (`install::Search`), the one place that knows the search order.
netsmith-kicad = { path = "../netsmith-kicad" }
