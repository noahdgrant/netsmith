[package]
name = "netsmith-kicad"
version.workspace = true
edition.workspace = true
license.workspace = true
# The tests are one executable, tests/main.rs, with the other files of the folder as its modules
# (#190): without this, cargo builds and links every file of the folder as well.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
netsmith-core = { path = "../netsmith-core" }
netsmith-sexp = { path = "../netsmith-sexp" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
uuid = { version = "1", features = ["v5"] }

[features]
# The KiCad-library check for tests (`install::skip_without_kicad_libraries`). Only
# dev-dependencies turn it on, so a release binary does not carry it.
test-support = []

[dev-dependencies]
netsmith-testkit = { path = "../netsmith-testkit" }
automod = "1.0.17"
