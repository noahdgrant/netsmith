[package]
name = "netsmith-pcb"
version.workspace = true
edition.workspace = true
license.workspace = true
# The tests are one executable, tests/main.rs, with the other files of the folder as its modules
# (#190): without this, cargo builds and links every file of the folder as well.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
netsmith-core = { path = "../netsmith-core" }
netsmith-kicad = { path = "../netsmith-kicad" }
# The pour filler and the drawing code of the Gerbers, which the copper as data reuses
# (`copper`, ADR 0105). netsmith-fab depends on no other netsmith crate but netsmith-kicad.
netsmith-fab = { path = "../netsmith-fab" }
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip`: a board read back from JSON (a placed board, `netsmith route`) has the very
# numbers it was written with, so it routes to the same copper.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
toml = "1.1.8"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
netsmith-check = { path = "../netsmith-check" }
netsmith = { path = "../netsmith" }
netsmith-solve = { path = "../netsmith-solve" }
