[package]
name = "netsmith-pcb"
version.workspace = true
edition.workspace = true
license.workspace = true
# The tests are one executable, tests/main.rs, with the other files of the folder as its modules
# (#190): without this, cargo builds and links every file of the folder as well.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
netsmith-core = { path = "../netsmith-core" }
netsmith-kicad = { path = "../netsmith-kicad" }
# The pour filler and the drawing code of the Gerbers, which the copper as data reuses
# (`copper`, ADR 0105), and the design rules check's room and teardrops.
netsmith-geom = { path = "../netsmith-geom" }
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip`: a board read back from JSON (a placed board, `netsmith route`) has the very
# numbers it was written with, so it routes to the same copper.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
toml = "1.1.8"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
automod = "1.0.17"
netsmith-testkit = { path = "../netsmith-testkit" }
# The tests resolve their processes with the check, the solver and the design stage, never with
# the netsmith crate: a crate the tests depend on makes them dependents of every crate it
# depends on, and the netsmith crate depends on all of them (issue #518).
netsmith-check = { path = "../netsmith-check" }
netsmith-design = { path = "../netsmith-design" }
# The placer, for the tests that check the board model on a placed board. It links the
# netsmith-pcb that is not the unit tests' build, so they read its board back through the JSON
# of a placed board (`board::tests::placed`).
netsmith-place-route = { path = "../netsmith-place-route" }
netsmith-solve = { path = "../netsmith-solve" }
