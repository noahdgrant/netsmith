[package]
name = "netsmith-place-route"
version.workspace = true
edition.workspace = true
license.workspace = true
# The tests are one executable, tests/main.rs, with the other files of the folder as its modules
# (#190): without this, cargo builds and links every file of the folder as well.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
netsmith-core = { path = "../netsmith-core" }
# The diff pairs the route scorecard measures (`pairs::PAIR_SUFFIXES`), which the escape lanes
# share between the two nets of a pair, and the arcs' tolerance.
netsmith-geom = { path = "../netsmith-geom" }
netsmith-kicad = { path = "../netsmith-kicad" }
netsmith-pcb = { path = "../netsmith-pcb" }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
automod = "1.0.17"
netsmith-testkit = { path = "../netsmith-testkit" }
# Not the netsmith crate, as in netsmith-pcb's tests (see there): a test of this crate would then
# be a dependent of every crate the netsmith crate links, netsmith-3d among them (issue #518).
netsmith-check = { path = "../netsmith-check" }
netsmith-design = { path = "../netsmith-design" }
# KiCad's check and the cross-check, which the tests run on routed boards as witnesses.
netsmith-fab = { path = "../netsmith-fab" }
netsmith-solve = { path = "../netsmith-solve" }
serde_json = "1.0.154"
