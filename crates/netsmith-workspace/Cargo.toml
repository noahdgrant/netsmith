[package]
name = "netsmith-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
# The tests are one executable, tests/main.rs, with the other files of the folder as its modules
# (#190): without this, cargo builds and links every file of the folder as well.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
netsmith-3d = { path = "../netsmith-3d" }
netsmith-catalog = { path = "../netsmith-catalog" }
netsmith-check = { path = "../netsmith-check" }
netsmith-core = { path = "../netsmith-core" }
netsmith-design = { path = "../netsmith-design" }
netsmith-editor = { path = "../netsmith-editor" }
netsmith-fab = { path = "../netsmith-fab" }
netsmith-fabricate = { path = "../netsmith-fabricate" }
netsmith-geom = { path = "../netsmith-geom" }
netsmith-kicad = { path = "../netsmith-kicad" }
netsmith-lang = { path = "../netsmith-lang" }
netsmith-pcb = { path = "../netsmith-pcb" }
netsmith-pipeline = { path = "../netsmith-pipeline" }
netsmith-quantity = { path = "../netsmith-quantity" }
netsmith-router = { path = "../netsmith-router" }
netsmith-solve = { path = "../netsmith-solve" }
netsmith-view = { path = "../netsmith-view" }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[dev-dependencies]
automod = "1.0.17"
netsmith-kicad = { path = "../netsmith-kicad", features = ["test-support"] }
# `Libraries::sample()`, over the sample libraries of netsmith-testkit.
netsmith-pipeline = { path = "../netsmith-pipeline", features = ["test-support"] }
netsmith-placer = { path = "../netsmith-placer" }
netsmith-testkit = { path = "../netsmith-testkit" }
tungstenite = "0.30.0"
