[package]
name = "netsmith"
version.workspace = true
edition.workspace = true
license.workspace = true
# The tests are one executable, tests/main.rs, with the other files of the folder as its modules
# (#190): without this, cargo builds and links every file of the folder as well.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
netsmith-catalog = { path = "../netsmith-catalog" }
netsmith-check = { path = "../netsmith-check" }
netsmith-core = { path = "../netsmith-core" }
netsmith-dxf = { path = "../netsmith-dxf" }
netsmith-editor = { path = "../netsmith-editor" }
netsmith-fab = { path = "../netsmith-fab" }
netsmith-fabricate = { path = "../netsmith-fabricate" }
netsmith-kicad = { path = "../netsmith-kicad" }
netsmith-lang = { path = "../netsmith-lang" }
netsmith-design = { path = "../netsmith-design" }
netsmith-netlist = { path = "../netsmith-netlist" }
netsmith-pcb = { path = "../netsmith-pcb" }
netsmith-pipeline = { path = "../netsmith-pipeline" }
netsmith-3d = { path = "../netsmith-3d" }
netsmith-placer = { path = "../netsmith-placer" }
netsmith-router = { path = "../netsmith-router" }
netsmith-quantity = { path = "../netsmith-quantity" }
netsmith-solve = { path = "../netsmith-solve" }
netsmith-view = { path = "../netsmith-view" }
# The SHA-256 of a part's STEP model, in the .glb and the STEP export so that a changed model
# shows in a diff (ADR 0108).
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip`: a placed board read back (`netsmith route`) has the numbers it was saved with.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
toml = "1.1.8"

[features]
# What the tests of this crate and of netsmith-cli need from it (`Libraries::sample()`, over the
# sample libraries of netsmith-testkit). Only dev-dependencies turn it on, so a release binary
# carries no test helpers.
test-support = ["netsmith-pipeline/test-support", "netsmith-fabricate/test-support"]

[dev-dependencies]
automod = "1.0.17"
# This crate with its `test-support` feature, for its integration tests.
netsmith = { path = ".", features = ["test-support"] }
netsmith-kicad = { path = "../netsmith-kicad", features = ["test-support"] }
netsmith-testkit = { path = "../netsmith-testkit" }
zip = { version = "6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tungstenite = "0.30.0"
