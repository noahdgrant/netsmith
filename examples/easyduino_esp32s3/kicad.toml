# What KiCad calls the parts this project defines itself (ADR 0021).
#
# Where Easyduino's footprint is not one netsmith makes with the same pads and courtyard, the part
# is drawn with Easyduino's own footprint (#728): the files of `libs/easyduino_original.pretty`
# are the footprints of `reference/Easyduino_ESP32S3.kicad_pcb`, written out by
#   cargo run -p netsmith-tools --example footprint_from_board -- reference/Easyduino_ESP32S3.kicad_pcb <REF> libs/easyduino_original.pretty
# with the board's additions taken off and nothing else changed. No KiCad install is needed.
# `README.md` (Parts) records what each part's maker documents say of the land pattern;
# `crates/netsmith-cli/tests/reproduce.rs` compares every footprint of the reproduction with
# Easyduino's. Every symbol is drawn from the part's pin table (no `symbol` key, ADR 0097),
# except the diode's, which netsmith draws itself.
#
# The AMS1117-3.3 (U5) is the standard `LinearRegulator` in SOT-223, which `std/kicad.toml` maps
# to the generator's `SOT-223-3_TabPin2`, Easyduino's footprint too; the resistors, the
# capacitors and the LEDs in 0402 are standard parts whose generated footprints are Easyduino's.

[[library]]
name = "easyduino_original"
footprints = "libs/easyduino_original.pretty"

# J1 and J2: the USB Type-C receptacle, Shouhan TYPE-C 16PIN 2MD(073), LCSC C2765186, on
# Easyduino's footprint, KiCad's `USB_C_Receptacle_G-Switch_GT-USB-7010ASV`.
[[part]]
kind = "ShouhanTypeC16Pin"
package = "SMD"
default = true
footprint = "easyduino_original:USB_C_Receptacle_G-Switch_GT-USB-7010ASV"

# SW1 and SW2: the XUNPU TS-1088-AR02016 tactile switch, LCSC C720477, on Easyduino's footprint,
# KiCad's `SW_Push_SPST_NO_Alps_SKRK`.
[[part]]
kind = "XunpuTs1088"
package = "SMD,4x3mm"
default = true
footprint = "easyduino_original:SW_Push_SPST_NO_Alps_SKRK"

# U1: Espressif ESP32-S3-WROOM-1, Easyduino's footprint (Espressif's KiCad library).
[[part]]
kind = "Esp32S3Wroom1"
package = "SMD, 25.5x18mm"
default = true
footprint = "easyduino_original:ESP32-S3-WROOM-1"

# Q1 and Q2: the SS8050 on Easyduino's footprint, KiCad's wide-lead `SOT-23W` (the datasheet's
# package outline and soldering footprint, page 4, are the plain SOT-23).
[[part]]
kind = "Ss8050"
package = "SOT-23"
default = true
footprint = "easyduino_original:SOT-23W"

# D2 and D3: ROHM's SMD1006 (1.0 x 0.6 mm), on Easyduino's footprint, KiCad's 0402 diode land
# (0.59 x 0.64 mm pads, 0.97 mm apart; ROHM's land is 0.35 x 0.60 mm pads, 0.65 mm apart).
[[part]]
kind = "Schottky"
package = "SMD1006"
symbol = "Device:D_Schottky"
footprint = "easyduino_original:D_0402_1005Metric"

# U3: the CP2102N in QFN-28, 5 x 5 mm, 0.5 mm pitch, centre pad 3.35 x 3.35 mm. The footprint is
# the generator's, Easyduino's too: the datasheet's land pattern (Silicon Labs CP2102N Rev. 1.5,
# Figure 6.2 and Table 6.2, printed page 35) has the same pitch, pad count and centre pad
# (X2 = Y2 = 3.35 mm); its lead pads are 0.30 x 0.95 mm with centres 4.80 mm apart (C1 = C2),
# the generator's 0.25 x 0.80 mm with centres 4.90 mm apart.
[[part]]
kind = "Cp2102n"
package = "QFN-28-EP(5x5)"
default = true
footprint = "Package_DFN_QFN:QFN-28-1EP_5x5mm_P0.5mm_EP3.35x3.35mm"

# U2: the development board's two 22-pin headers, one footprint of 44 pads. Not Easyduino's own:
# theirs draws no courtyard and draws the board's outline, and netsmith gives a footprint with no
# courtyard its pads and 0.25 mm as one, the whole board on both faces. This one has
# Easyduino's pads and draws its courtyard on `B.CrtYd` only (README.md, Parts), so the top face
# inside the rows is free for the other parts.
[[library]]
name = "easyduino_must_match"
footprints = "libs/easyduino_must_match.pretty"

[[part]]
kind = "Esp32S3DevKitCHeaders"
package = "2x22,P=2.54mm"
default = true
footprint = "easyduino_must_match:PinHeader_2x22_P2.54mm_Espressif_ESP32-S3-DevKitC-1"

# C6, C7 and C10: the 22 uF tantalum capacitor of the reference board (Kyocera AVX TAJA226K010RNJ,
# LCSC C11366), case A, EIA 3216-18. The standard capacitor rows stop at the ceramic sizes
# 0402 to 1210 and no generator answers a molded tantalum chip, so the footprint is a file of
# the project's library: the reference board's pads (README, Parts).
[[library]]
name = "easyduino_ics"
footprints = "libs/easyduino_ics.pretty"

[[part]]
kind = "Capacitor"
package = "CASE-A-3216-18"
symbol = "Device:C"
footprint = "easyduino_ics:CP_EIA-3216-18_Tantalum_A"
