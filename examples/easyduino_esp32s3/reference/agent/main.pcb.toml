version = 1

# The layout file keeps a solution, never a requirement (docs/LANGUAGE.md, "The layout file").
# Everything the board must match of Easyduino's is in `main.physical.nsm`; the placer puts every
# other part. It does not find a place for the module on its own once the buttons stand where
# Easyduino's do (it puts the module on the back face or over the header pads, and `fab` stops
# with the courtyards in each other), so the module is recorded here and locked: inside the two
# header rows, above the buttons, on the top face, not turned. Easyduino's own module sits 7 mm
# higher with its antenna 6.2 mm past the top edge of the board; this one is wholly on the board,
# so no overhang is stated. The module need not match, and nothing is gated on this entry.
# Seed 1 routes the board completely, and seeds 6 and 8 too, each within a route timeout of 5 s.
# The seed was 3 until designators were numbered by path (#634), which reorders the pins of each
# net that the placer and router read and so changes every arrangement. Checked 2026-11-16
# (#718), seeds 3, 4, 5 and 7 route too at `fab`'s own timeout; seed 0 leaves
# `net-auto_reset.q_en.collector`, and seed 2 leaves one wire of the USB pair (`net-bridge.dp` or
# `.dm`) in every order of the parts, because it puts a decoupling capacitor 0.4 mm from the
# CP2102N's USB pins, room for one track past pins 3 to 7, which all need it: a placement no
# router completes.
[EasyduinoEsp32s3]
seed = 1

[EasyduinoEsp32s3.parts."auto_reset.q_boot"]
at = [16.895, 30.1486]
rotation = 180.0
side = "top"
lock = true
source = "import"

