# The footprints of Easyduino's board that a copy of it must reproduce (the owner's rule: the
# outline, the mounting holes, the connectors, the buttons and switches, and the header
# pin-to-signal mapping). Read by `reference_table --must-match`; the outline and the holes are
# always must-match. Not required: the module (U1), the USB-UART bridge (U3), the regulator
# (U5), the transistors, the diodes, the LEDs, the passives and the routing.
#
#   J1, J2   the two USB-C receptacles
#   SW1, SW2 the RESET button (pad 2 on EN) and the BOOT button (pad 2 on GPIO0)
#   U2       the footprint of the development board's two 22-pin headers (44 pads); it also
#            draws the board's outline (see README.md)
references = ["J1", "J2", "SW1", "SW2", "U2"]
