# What KiCad calls the four parts this example defines itself (ADR 0021). No KiCad install is
# needed to build or fab it. The footprints of the sensor plug, the chip antenna and the flat
# cell are the project's own, in `libs/` (`README.md` says where each comes from: the antenna's
# pads are read from Johanson's datasheet). The memory's SOIC-8 footprint is the generator's.
# The plug, the memory and the antenna name no `symbol`, so each is drawn from its pin table
# (ADR 0097); the flat cell uses the two-pin header glyph that netsmith draws itself.

[[library]]
name = "flat"
footprints = "libs/flat.pretty"

[[library]]
name = "plug"
footprints = "libs/plug.pretty"

[[library]]
name = "johanson"
footprints = "libs/johanson.pretty"

[[part]]
kind = "SensorPlug16"
package = "2.54mm-horizontal"
default = true
footprint = "plug:PinHeader_1x16_P2.54mm_Horizontal"

[[part]]
kind = "Memory"
package = "SOIC-8"
default = true
footprint = "Package_SO:SOIC-8_3.9x4.9mm_P1.27mm"

[[part]]
kind = "ChipAntenna"
package = "2450AT43F0100"
default = true
footprint = "johanson:Johanson_2450AT43F0100"

[[part]]
kind = "FlatCell"
package = "30x26"
default = true
symbol = "Connector_Generic:Conn_01x02"
footprint = "flat:Cell"

[part.pin_names]
POS = "Pin_1"
NEG = "Pin_2"
