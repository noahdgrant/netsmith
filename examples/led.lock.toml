# The catalog row each part of each board was picked as, written by `netsmith board build` and
# `netsmith board fab` when this file does not exist. Commit it: a change to a catalog or to the
# solver that would move a pick shows here and not only in the bill of materials. Refresh it
# with `netsmith project lock --update`, and number the parts again by path with `--renumber`.
# Nothing in it is edited by hand but `held = "reason"`, which a person adds to a part's entry
# to keep the part on its row, and a part's designator, which a renamed part takes by hand.
# Each part's footprint has the hash of its pads and courtyard: a change to the footprint shows
# here, and `netsmith project lock --update` takes it.
version = 2

[LedExample.providers."process"]
generic = "TwoLayer"
provider = "std::mfg::jlcpcb::JlcTwoLayer1oz"

[LedExample.parts."led"]
catalog = "led"
row = "KT-0603R RED LED 0603 C2286"
mpn = "KT-0603R"
sku = { jlcpcb-assembly = "C2286", lcsc-retail = "C2286" }

[LedExample.parts."power_in"]
catalog = "header"
row = "PH2.54-1X2P-H25 2-pin 2.54mm header C42431798"
mpn = "PH2.54-1X2P-H25"
sku = { jlcpcb-assembly = "C42431798", lcsc-retail = "C42431798" }

[LedExample.parts."r1"]
catalog = "resistor"
row = "330Ω 1% 0402 C25104"
mpn = "0402WGF3300TCE"
sku = { jlcpcb-assembly = "C25104", lcsc-retail = "C25104" }

[LedExample.designators]
"led" = "D1"
"power_in" = "J1"
"r1" = "R1"

[LedExample.footprints]
"led" = { footprint = "LED_SMD:LED_0603_1608Metric", hash = "2a500898dd78be5f" }
"power_in" = { footprint = "Connector_PinHeader_2.54mm:PinHeader_1x02_P2.54mm_Vertical", hash = "4f0b767adeef1876" }
"r1" = { footprint = "Resistor_SMD:R_0402_1005Metric", hash = "1db463f93ba694f7" }
