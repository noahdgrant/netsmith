# Which part of the board `netsmith fab` writes is which part of ORBIT's board: one line per part,
# `<ORBIT's reference> = "<the reference in fab's .kicad_pcb>"`, for example
#   USB1 = "J1"
# A part of reference/placements.toml with no line here is `unmapped` to the parity checker: a
# failure for the parts the table marks must_match (USB1, BAT1, J1, J2, SW1, SW2, BOOT0, PWR1), a
# note for the others.
#
# All 48 parts of the circuit are paired, by value, pad count and nets, so that the checker can
# see through the connectivity which pads share a net. netsmith's references come from the kind
# of the part and the order of its declaration (a part's letter, then the count of that letter;
# `fab` writes them to the board and the BOM), so most of ORBIT's differ: its USB connector is
# J1 here and its J1 is J3. Where several parts are alike (the four 100 nF capacitors on +3V3 C3
# to C6, the two 1.5 kohm resistors R4 and R5, the two 4.7 uF) the pairing is arbitrary: they
# are on the same nets. ORBIT's H1 to H4 have no line: the checker judges a plated mounting hole
# as a hole, by its place, drill, plating, pad size and net, and not as a part
# (`crates/netsmith/src/parity.rs`); the logo `O` has no pad. A test (`the_parity_checkers_designator_map_is_the_designs_own`) holds this
# file against the design's own designators.

# The connectors, the switches and the buttons (must match).
USB1 = "J1"    # usb
BAT1 = "J2"    # battery
J1 = "J3"      # header_west
J2 = "J4"      # header_east
PWR1 = "SW1"   # power_switch
BOOT0 = "SW3"  # boot_switch
SW1 = "SW2"    # reset_button
SW2 = "SW4"    # user_button

# The chips, the crystal and the inductor.
U1 = "U1"      # charger.ic
U10 = "Y1"     # oscillator.crystal
U15 = "U2"     # buck_boost.ic
U16 = "U3"     # mcu
U17 = "U5"     # eeprom
U22 = "U4"     # usb_uart.ic
L1 = "L1"      # buck_boost.inductor

# The LEDs.
D1 = "D1"      # charger.status_led
D2 = "D2"      # led1
D3 = "D3"      # led2

# The resistors.
R1 = "R2"      # charger.status_resistor
R2 = "R6"      # boot_pulldown
R3 = "R1"      # charger.rprog
R4 = "R9"      # led1_resistor
R5 = "R10"     # led2_resistor
R6 = "R5"      # buck_boost.pg_pullup.resistor
R7 = "R3"      # buck_boost.divider_top
R8 = "R4"      # buck_boost.divider_bottom
R9 = "R12"     # i2c_pullups.scl_pullup
R10 = "R11"    # i2c_pullups.sda_pullup
R11 = "R8"     # user_series
R12 = "R7"     # user_pulldown.resistor

# The capacitors.
C2 = "C5"      # v3v3_bulk
C3 = "C6"      # v3v3_100n_1
C4 = "C7"      # v3v3_100n_2
C5 = "C8"      # v3v3_100n_3
C6 = "C9"      # v3v3_100n_4
C7 = "C2"      # charger.vbatt_cap
C8 = "C1"      # charger.vbus_cap
C9 = "C12"     # reset_cap
C11 = "C10"    # oscillator.load_in
C12 = "C11"    # oscillator.load_out
C13 = "C4"     # buck_boost.output_cap
C14 = "C3"     # buck_boost.input_cap
C18 = "C13"    # user_node_cap
C19 = "C14"    # user_pin_cap
C20 = "C15"    # usb_uart.vdd_bulk
C21 = "C16"    # usb_uart.vdd_100n
C23 = "C17"    # usb_uart.vbus_1u
C24 = "C18"    # usb_uart.vbus_100n
