version = 1

# The layout file keeps a solution, never a requirement (docs/LANGUAGE.md, "The layout file").
# Everything the board must match of ORBIT's is in `main.physical.nsm`; the placer puts every
# other part (the ICs, the crystal, the inductor, the LEDs, the resistors and capacitors), and a
# seed is another arrangement of them. Seed 4 routes this board completely, and seeds 5, 6 and 8
# route too; seeds 0, 1, 2, 3 and 7 leave one connection of a USB pair (`net-usb.dm`). The seed
# was 1 until designators were numbered by path (#634), which reorders the pins of each net that
# the placer and router read and so changes every arrangement; that the router misses one wire of
# a USB pair on some arrangements is #718. No part is locked: the file records no position.
[Orbit]
seed = 4
