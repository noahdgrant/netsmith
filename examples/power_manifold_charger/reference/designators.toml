# Which part of the board `netsmith fab` writes is which part of the charger module's board: one
# line per part, `<the board file's reference> = "<the reference in fab's .kicad_pcb>"`, for
# example
#   J2 = "J2"
# A part of reference/placements.toml with no line here is `unmapped` to the parity checker: a
# failure for the parts the table marks must_match (J2, J3, J4), a note for the others.
#
# All 89 parts are paired. netsmith's references come from the kind of the part and the order of
# its declaration in `src/main.nsm` (a part's letter, then the count of that letter), so most of
# the board's differ (the edge connector is J1 here and J3 there, the receptacle J2 and J4, the
# programming pads J3 and J2, the test points TP1 to TP3, the converter U2 and U1 the
# microcontroller, ...). The pairing is by what each part is, proved by the test `board` of
# crates/netsmith/tests/power_manifold.rs (`PARTS`: the member of the design; the other tests
# there show that every pad has the same pads on its net on both sides); the test prints this
# map when it is stale.

