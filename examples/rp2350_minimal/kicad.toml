# What KiCad calls the parts this project defines itself (ADR 0021).
#
# The footprints are written from the makers' recommended land patterns, in the project's own
# library `libs/rp2350_minimal.pretty` (no KiCad install is needed: the files are the project's);
# `README.md` (Parts) records the document, revision and page of each and what was read, derived
# or assumed. U2, the NCP1117ST33T3G, is the standard `LinearRegulator` in the package SOT-223,
# which `std/kicad.toml` already maps to the generator's `SOT-223-3_TabPin2`: a project may not
# map a pair that the standard mapping maps, so it has no row here.

[[library]]
name = "rp2350_minimal"
footprints = "libs/rp2350_minimal.pretty"

# L1: the 0806 (2016 metric) package of the Abracon inductor; the standard rows stop at 0805
# and 1210, and no generator answers 2016. The symbol is drawn from the pin table, so no KiCad
# symbol library is read.
[[part]]
kind = "Inductor"
package = "0806"
footprint = "rp2350_minimal:L_Abracon_AOTA-B201610S3R3-101-T"

# SW1 and SW2: the Wurth tactile switch. The symbol is drawn from the pin table.
[[part]]
kind = "TactileSwitch"
package = "SMD-4P(4.2x3.2)"
default = true
footprint = "rp2350_minimal:SW_Wurth_434133025816"
