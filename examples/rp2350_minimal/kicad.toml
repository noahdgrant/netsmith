# What KiCad calls the parts this project defines itself (ADR 0021).
#
# Every part is drawn with Raspberry Pi's own footprint, the one its board has (#728): the files
# of `libs/rp2350_original.pretty` are the footprints of `reference/RPI-RP2350A-MINIMAL_R4-S1.kicad_pcb`
# (its library `RPI_COMPILED`), written out by
#   cargo run -p netsmith-tools --example footprint_from_board -- reference/RPI-RP2350A-MINIMAL_R4-S1.kicad_pcb <REF> libs/rp2350_original.pretty
# with the board's additions taken off and nothing else changed, except U2's tab (below). So the
# pads, the courtyards and the frames are the original's, and the reproduction places each part
# as the original does. No KiCad install is needed. `README.md` (Parts) records what each part's
# maker documents say of the land pattern; `crates/netsmith-cli/tests/reproduce.rs` compares
# every footprint of the reproduction with the original's.
#
# The parts are drawn from their pin tables (no `symbol`, ADR 0097), except the mounting hole.

[[library]]
name = "rp2350_original"
footprints = "libs/rp2350_original.pretty"

# L1: the Abracon AOTA-B201610S3R3-101-T in the 0806 (2016 metric) package; the standard rows
# stop at 0805 and 1210.
[[part]]
kind = "Inductor"
package = "0806"
footprint = "rp2350_original:abracon_aota-b201610s3r3-101-t"

# SW1 and SW2: the Wurth 434133025816 tactile switch.
[[part]]
kind = "TactileSwitch"
package = "SMD-4P(4.2x3.2)"
default = true
footprint = "rp2350_original:wurthelek_434133025816"

# U1: the RP2350A, QFN-60, 7 x 7 mm, 0.4 mm pitch, with nine vias in its exposed pad (pad 61, the
# ground, as the original numbers them).
[[part]]
kind = "Rp2350A"
package = "QFN-60-EP(7x7)"
default = true
footprint = "rp2350_original:rpi_rp2350a_vias"

# U3: the W25Q128JV in the SOIC 208-mil package.
[[part]]
kind = "W25Q128Jv"
package = "SOIC-8-208mil"
default = true
footprint = "rp2350_original:generic_soic127p790x195-8"

# X1: the ABM8-272-T3, 3.2 x 2.5 mm, four pads.
[[part]]
kind = "Abm8272T3"
package = "SMD3225-4P"
default = true
footprint = "rp2350_original:generic_xtalcc320x250x80-4"

# J1: Amphenol FCI 10103594-0001LF.
[[part]]
kind = "Amphenol10103594"
package = "SMD"
default = true
footprint = "rp2350_original:amphenol_10103594-0001lf"

# J4: JST SM03B-SRSS-TB(LF)(SN).
[[part]]
kind = "JstSm03bSrssTb"
package = "SMD,P=1mm,Surface Mount,Right Angle"
default = true
footprint = "rp2350_original:jst_sm03b-srss-tb-lf--sn-"

# J2 and J3: Samtec TSW-118-07-L-D.
[[part]]
kind = "SamtecTsw11807LD"
package = "TSW-118-07-L-D"
default = true
footprint = "rp2350_original:samtec_tsw-118-07-l-d"

# The four mounting holes: 2.75 mm, non-plated, for M2.5 screws. The standard rows have only M2
# (2.2 mm) and M3 (3.2 mm). The symbol is netsmith's own.
[[part]]
kind = "MountingHole"
package = "M2.5"
symbol = "Mechanical:MountingHole"
footprint = "rp2350_original:none_mh_npth_fd2p75mm_sm3p15mm_ko6mm"

# The parts of standard rows, whose land patterns Raspberry Pi drew otherwise. A project may not
# map a kind and package that `std/kicad.toml` maps, and the original draws two 0402 capacitors
# with a wider land than the others, so each is a `[[member]]` row: the part, by its member path,
# and its footprint (`reference/parts.toml` gives the original's designator of each path).

# U2: the NCP1117ST33T3G, the standard `LinearRegulator` in SOT-223. Raspberry Pi's footprint
# numbers the tab 4; the standard regulator's pin table, like KiCad's `SOT-223-3_TabPin2`, has
# the tab as a second pad 2 (the output), so the copy numbers it 2. The copper is the same.
[[member]]
path = "regulator"
footprint = "rp2350_original:onsemi_ncp1117st33t3g"

# C1, C5 and C19: the 10 uF capacitors in 0805 (2012 metric).
[[member]]
path = "vbus_bulk"
footprint = "rp2350_original:generic_capc2012x125"

[[member]]
path = "v3v3_bulk[0]"
footprint = "rp2350_original:generic_capc2012x125"

[[member]]
path = "v3v3_bulk[1]"
footprint = "rp2350_original:generic_capc2012x125"

# C6 and C7: two of the 4.7 uF capacitors in 0402, on the wider land (0.47 x 0.55 mm pads,
# 1.03 mm apart).
[[member]]
path = "v3v3_bulk_c"
footprint = "rp2350_original:generic_capc1005x50_wide"

[[member]]
path = "v1v1_bulk"
footprint = "rp2350_original:generic_capc1005x50_wide"

