version = 1

# The layout file keeps a solution, never a requirement (docs/LANGUAGE.md, "The layout file").
# Everything the board must match of Raspberry Pi's is in `main.physical.nsm`; the placer puts
# every other part (MCU, flash, crystal, regulator, inductor, resistors, capacitors), and a seed
# is another arrangement of them. This board is dense (a QFN-60 of 0.4 mm pitch with 175
# connections on two layers), so the router finishes it on some arrangements and leaves one to
# three connections on others, and which seeds finish moves whenever a part's footprint moves.
# With Raspberry Pi's footprints (#728) and the router's ratsnest counting the plated holes
# inside the RP2350's exposed pad as part of the pad (#731), seeds 0 and 4 route completely
# (220 s and 176 s, a debug build on a busy machine); seeds 1, 2 and 3 leave three, two and one
# connection after 300 s. Seed 3, the seed of the earlier footprints, is the one that moved.
# No part is locked: the file records no position.
[Rp2350Minimal]
seed = 4
