# What KiCad calls the parts this example defines itself (ADR 0021). The microcontroller and
# the regulator IC are invented and drawn by the library of this project (the microcontroller
# has a footprint of its own in `libs/bench.pretty`, with a pad for every pin of both of its units,
# which no stock footprint has). The amplifier is a symbol of three units (two amplifiers and a
# power unit, the split of a dual op amp), because the bench exists to draw symbols of several
# units; it is the project's own symbol in `libs/bench.kicad_sym`, so no KiCad install is read.
# Every other footprint is one that a generator answers.

[[library]]
name = "bench"
symbols = "libs/bench.kicad_sym"
footprints = "libs/bench.pretty"

[[part]]
kind = "Mcu97"
package = "QFP"
default = true
symbol = "bench:Mcu97"
footprint = "bench:Mcu97"

[[part]]
kind = "Buck1V8"
package = "QFN"
default = true
symbol = "bench:Buck1V8"
footprint = "bench:Buck1V8"

[[part]]
kind = "DualOpAmp"
package = "SOIC-8"
default = true
symbol = "bench:DualOpAmp"
footprint = "Package_SO:SOIC-8_3.9x4.9mm_P1.27mm"

# The symbol names its inputs "+" and "-" in both amplifiers, as an op amp is drawn, and leaves
# the outputs unnamed ("~"); the part's pins are IN_A+ and so on.
[part.pin_names]
"IN_A+" = "+"
"IN_A-" = "-"
"IN_B+" = "+"
"IN_B-" = "-"

[[part]]
kind = "Ldo8"
package = "DFN"
default = true
symbol = "bench:Ldo8"
footprint = "gen:DFN(pins=8, pitch=0.65mm, body=2.95-3.05x2.95-3.05mm, ep=1.55x2.4mm, lead_width=0.2-0.3mm, lead_length=0.3-0.5mm)"

[[part]]
kind = "Obd10"
package = "P"
default = true
symbol = "bench:Conn10"
footprint = "Connector_PinHeader_2.54mm:PinHeader_2x05_P2.54mm_Vertical"

[[part]]
kind = "Ten10"
package = "P"
default = true
symbol = "bench:Conn10"
footprint = "Connector_PinHeader_2.54mm:PinHeader_2x05_P2.54mm_Vertical"
