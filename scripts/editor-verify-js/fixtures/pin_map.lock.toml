# The catalog row each part of each board was picked as, written by `netsmith board build` and
# `netsmith board fab` when this file does not exist. Commit it: a change to a catalog or to the
# solver that would move a pick shows here and not only in the bill of materials. Refresh it
# with `netsmith project lock --update`, and number the parts again by path with `--renumber`.
# Nothing in it is edited by hand but `held = "reason"`, which a person adds to a part's entry
# to keep the part on its row, and a part's designator, which a renamed part takes by hand.
version = 2

[PinMapBoard.parts."load"]
catalog = "resistor"
row = "10kΩ 1% 0603 C25804"
mpn = "0603WAF1002T5E"
sku = { jlcpcb-assembly = "C25804", lcsc-retail = "C25804" }

# A part the board no longer has: the lock is not current, and the editor lists what
# `netsmith project lock --check` would say.
[PinMapBoard.parts."pullup"]
catalog = "resistor"
row = "4.7kΩ 1% 0402 C25900"
mpn = "0402WGF4701TCE"
sku = { jlcpcb-assembly = "C25900", lcsc-retail = "C25900" }

[PinMapBoard.parts."pull"]
catalog = "resistor"
row = "4.7kΩ 1% 0402 C25900"
mpn = "0402WGF4701TCE"
sku = { jlcpcb-assembly = "C25900", lcsc-retail = "C25900" }

[PinMapBoard.designators]
"load" = "R1"
"pull" = "R2"
"u" = "U1"

[PinMapBoard.footprints]
"load" = { footprint = "Resistor_SMD:R_0603_1608Metric", hash = "f3b73a45a68c6dba" }
"pull" = { footprint = "Resistor_SMD:R_0402_1005Metric", hash = "1db463f93ba694f7" }
