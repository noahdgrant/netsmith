# What KiCad calls the standard library's parts: which symbol draws them and which
# footprint carries them. This is the only place KiCad's names appear (ADR 0016, ADR 0021).
# A project adds its own parts in a `kicad.toml` at its root; a (kind, package) pair that is
# in both files is an error, so there is one answer.
#
# `default = true` marks the footprint used when the part was never given a package.
#
# `symbol` may be left out of the row of an IC (a part that has a pin table): netsmith then
# draws the symbol itself, a box with the pins on its sides, and the part needs no KiCad symbol
# library (ADR 0097, step 1). A row that names a `symbol` is drawn with it. A `power` pin that
# the solved design says gives power (a regulator's output) is drawn as a power output on the
# right of the box; a power pin that takes power, of a part that also has a pin that gives
# power (a regulator's or a converter's input), is on the left, where the schematic layout reads
# the input of a converter; any other power pin that takes power, or whose direction is not
# known, stays above. The linear regulator is drawn this way, from its pin table (`IN`, `OUT`,
# `GND`).
# A `symbol` that names a symbol that netsmith draws itself (`Device:R`, `Device:D_Schottky`,
# `Transistor_FET:Q_NMOS_GSD`, `Connector_Generic:Conn_01x02`, `Connector:USB_C_Receptacle_*`,
# `Connector:TestPoint`, `Mechanical:MountingHole`, ... the list is
# `netsmith_kicad::passive_symbol_ids`, and the power flag `power:PWR_FLAG` that the exporter places
# is among them) is answered with netsmith's own symbol of that id, before any KiCad library is
# read (ADR 0097, step 2): the row stays as it is, and the part needs no installed KiCad symbol
# library. The glyph is drawn in `crates/netsmith-kicad/src/passives.rs`; the pins are where
# KiCad's are. No row of this file names a symbol that is read from KiCad's libraries any more.
# `pin_names` renames the pins of a named symbol, so a row with no `symbol` has none.
#
# A symbol or footprint of the library `netsmith` is not KiCad's: it is one of the files in
# `std/libs/`, which the binary carries for the packages and parts that KiCad's libraries do not
# have (ADR 0087). Every footprint of this file is generated (ADR 0043) or such a file: none is
# read from KiCad's libraries (ADR 0097, step 3), so no row needs an installed KiCad footprint
# library.

[[part]]
kind = "Resistor"
package = "0402"
symbol = "Device:R"
footprint = "Resistor_SMD:R_0402_1005Metric"

