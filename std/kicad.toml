# What KiCad calls the standard library's parts: which symbol draws them and which
# footprint carries them. This is the only place KiCad's names appear (ADR 0016, ADR 0021).
# A project adds its own parts in a `kicad.toml` at its root; a (kind, package) pair that is
# in both files is an error, so there is one answer.
#
# `default = true` marks the footprint used when the part was never given a package.

[[part]]
kind = "Resistor"
package = "0402"
symbol = "Device:R"
footprint = "Resistor_SMD:R_0402_1005Metric"

[[part]]
kind = "Resistor"
package = "0603"
symbol = "Device:R"
footprint = "Resistor_SMD:R_0603_1608Metric"

[[part]]
kind = "Resistor"
package = "0805"
symbol = "Device:R"
footprint = "Resistor_SMD:R_0805_2012Metric"

[[part]]
kind = "Capacitor"
package = "0402"
symbol = "Device:C"
footprint = "Capacitor_SMD:C_0402_1005Metric"

[[part]]
kind = "Capacitor"
package = "0603"
symbol = "Device:C"
footprint = "Capacitor_SMD:C_0603_1608Metric"

[[part]]
kind = "Capacitor"
package = "0805"
symbol = "Device:C"
footprint = "Capacitor_SMD:C_0805_2012Metric"

[[part]]
kind = "Capacitor"
package = "1206"
symbol = "Device:C"
footprint = "Capacitor_SMD:C_1206_3216Metric"

[[part]]
kind = "Capacitor"
package = "1210"
symbol = "Device:C"
footprint = "Capacitor_SMD:C_1210_3225Metric"

[[part]]
kind = "LinearRegulator"
package = "SOT-23"
symbol = "Regulator_Linear:AP1117-15"
footprint = "Package_TO_SOT_SMD:SOT-23"

[part.pin_names]
IN = "VI"
OUT = "VO"

[[part]]
